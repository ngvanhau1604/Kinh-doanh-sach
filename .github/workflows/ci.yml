name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the real floor: numpy 2.3.5 requires >=3.11. 3.12 and 3.13 are the versions
        # this project is actually run on, so they are tested rather than assumed.
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Pipeline smoke run (separate output directory)
        run: python run.py --out .ci-out --skip-presentation --replications 3

      # --check executes the notebook and fails if the committed file differs from a fresh run.
      # It proves the committed outputs are current, and that re-execution is idempotent: the
      # notebook no longer dirties the working tree, because nbclient's per-cell timestamps are
      # stripped before writing.
      - name: Execute notebook and verify committed outputs are current
        run: python tools/execute_notebook.py --check

      - name: Working tree is clean after a full run
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after running the pipeline and notebook:"
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi
          echo "Working tree clean."

      - name: Check text outputs are LF-only
        shell: bash
        run: |
          for f in report/bao_cao.md report/bao_cao.html results/metrics.json results/manifest.json; do
            if grep -qU $'\r' "$f"; then echo "CRLF found in $f"; exit 1; fi
          done
          echo "All text outputs use LF."
